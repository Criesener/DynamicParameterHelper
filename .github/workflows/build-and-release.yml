name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run performance tests
        run: npm run test:performance

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Rollup (Primary)
        run: npm run build:rollup

      - name: Build with Webpack (Alternative)
        run: npm run build:webpack

      - name: Generate bundle analysis
        run: npm run build:webpack:analyze

      - name: Check bundle sizes
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "### Rollup Build" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/index.html | awk '{print "- Single HTML file: " $5}' >> $GITHUB_STEP_SUMMARY
          echo "### Webpack Build" >> $GITHUB_STEP_SUMMARY
          ls -lh dist-webpack/*.js dist-webpack/*.html | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY
          
          echo "Checking 500KB size limit..."
          ROLLUP_SIZE=$(stat -f%z dist/index.html)
          WEBPACK_TOTAL=$(find dist-webpack -name "*.js" -o -name "*.html" | xargs stat -f%z | awk '{sum += $1} END {print sum}')
          
          if [ $ROLLUP_SIZE -gt 512000 ]; then
            echo "❌ Rollup build exceeds 500KB limit: ${ROLLUP_SIZE} bytes"
            exit 1
          else
            echo "✅ Rollup build size OK: ${ROLLUP_SIZE} bytes"
          fi
          
          if [ $WEBPACK_TOTAL -gt 512000 ]; then
            echo "❌ Webpack build exceeds 500KB limit: ${WEBPACK_TOTAL} bytes"
            exit 1
          else
            echo "✅ Webpack build size OK: ${WEBPACK_TOTAL} bytes"
          fi

      - name: Test built files
        run: |
          echo "Testing Rollup build..."
          if [ ! -f dist/index.html ]; then
            echo "❌ Rollup build failed - index.html not found"
            exit 1
          fi
          
          # Basic content checks
          if ! grep -q "DocumentParser" dist/index.html; then
            echo "❌ Rollup build missing DocumentParser"
            exit 1
          fi
          
          echo "Testing Webpack build..."
          if [ ! -f dist-webpack/index.html ]; then
            echo "❌ Webpack build failed - index.html not found"
            exit 1
          fi
          
          echo "✅ All builds passed basic validation"

      - name: Upload Rollup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollup-build
          path: |
            dist/
            !dist/debug/

      - name: Upload Webpack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webpack-build
          path: dist-webpack/

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: dist-webpack/bundle-analysis.html

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rollup build
        uses: actions/download-artifact@v4
        with:
          name: rollup-build
          path: dist/

      - name: Download Webpack build
        uses: actions/download-artifact@v4
        with:
          name: webpack-build
          path: dist-webpack/

      - name: Download bundle analysis
        uses: actions/download-artifact@v4
        with:
          name: bundle-analysis
          path: analysis/

      - name: Create release archives
        run: |
          # Create release archives
          tar -czf dynamic-parameter-helper-rollup.tar.gz -C dist .
          tar -czf dynamic-parameter-helper-webpack.tar.gz -C dist-webpack .
          zip -r dynamic-parameter-helper-rollup.zip dist/*
          zip -r dynamic-parameter-helper-webpack.zip dist-webpack/*
          
          # Calculate checksums
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Extract release notes
        id: extract_notes
        run: |
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Create release notes
          cat > release_notes.md << EOF
          # DynamicParameterHelper $VERSION
          
          ## Single-File Distribution
          - **Rollup Build**: Single HTML file with all dependencies inlined (< 500KB)
          - **Webpack Build**: Separate files for development and debugging
          
          ## Features
          - XML and JSON document parsing
          - XPath and JSONPath generation
          - Interactive tree view
          - File upload and drag-and-drop
          - Comprehensive test suite
          
          ## Bundle Sizes
          $(ls -lh dynamic-parameter-helper-*.zip | awk '{print "- " $9 ": " $5}')
          
          ## Usage
          1. Download the Rollup build for single-file usage
          2. Open \`index.html\` in any modern browser
          3. No additional dependencies required
          
          ## Technical Details
          - Built with Rollup and Webpack
          - ES2018+ compatible
          - Source maps included
          - Bundle analysis report available
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.extract_notes.outputs.version }}
          body_path: release_notes.md
          files: |
            dynamic-parameter-helper-rollup.tar.gz
            dynamic-parameter-helper-webpack.tar.gz
            dynamic-parameter-helper-rollup.zip
            dynamic-parameter-helper-webpack.zip
            checksums.txt
            analysis/bundle-analysis.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-demo:
    name: Deploy Demo to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rollup build
        uses: actions/download-artifact@v4
        with:
          name: rollup-build
          path: public/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4